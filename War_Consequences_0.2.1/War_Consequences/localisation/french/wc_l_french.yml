l_french:
 war_consequences.1.t:0 "Crise au sein des forces armées"
 war_consequences.1.d:0 "La guerre épuise les unités et fragilise la chaîne de commandement. Des officiers contestent les décisions du gouvernement et la discipline se dégrade."
 war_consequences.1.a:0 "Rétablir l'autorité du commandement"
 war_consequences.1.b:0 "Faire des concessions aux officiers"
 war_consequences.2.t:0 "Désorganisation de l'appareil industriel"
 war_consequences.2.d:0 "Les pénuries, les destructions et les difficultés de transport perturbent la production."
 war_consequences.2.a:0 "Priorité aux réparations et au ravitaillement"
 war_consequences.2.b:0 "Maintenir la production à tout prix"
 war_consequences.3.t:0 "Manifestations contre la guerre"
 war_consequences.3.d:0 "La population exprime sa lassitude. Des rassemblements et des grèves ponctuelles mettent le gouvernement sous pression."
 war_consequences.3.a:0 "Ouvrir des négociations avec les représentants"
 war_consequences.3.b:0 "Maintenir l'effort de guerre"
 war_consequences.4.t:0 "Montée des mouvements séparatistes"
 war_consequences.4.d:0 "Des responsables régionaux contestent l'autorité centrale. La pression autonomiste augmente, sans qu'un nouvel État soit encore constitué."
 war_consequences.4.a:0 "Accorder des garanties aux régions"
 war_consequences.4.b:0 "Réaffirmer l'unité nationale"
 war_consequences.5.t:0 "Pressions en faveur d'une paix séparée"
 war_consequences.5.d:0 "Une partie du gouvernement réclame l'ouverture de négociations, même si les alliés continuent le combat. Cet événement représente une pression politique : il ne signe pas automatiquement la paix."
 war_consequences.5.a:0 "Préparer une initiative diplomatique"
 war_consequences.5.b:0 "Refuser toute concession"
 war_consequences.6.t:0 "Un gouvernement en exil s'organise"
 war_consequences.6.d:0 "Après la capitulation, des autorités cherchent à préserver leur légitimité depuis l'étranger. Le moteur vanilla de HOI4 reste responsable du statut réel d'exil."
 war_consequences.6.a:0 "Maintenir les institutions en exil"
 war_consequences.6.b:0 "Concentrer les moyens sur la résistance"
 war_consequences.7.t:0 "Paralysie administrative"
 war_consequences.7.d:0 "Les administrations locales ne parviennent plus à appliquer correctement les décisions du gouvernement."
 war_consequences.7.a:0 "Centraliser les ressources restantes"
 war_consequences.7.b:0 "Laisser davantage d'autonomie aux autorités locales"
 war_consequences.8.t:0 "Mobilisation générale"
 war_consequences.8.d:0 "Le gouvernement envisage une mobilisation exceptionnelle, qui renforcera l'armée mais pèsera sur la société."
 war_consequences.8.a:0 "Mobiliser toutes les ressources disponibles"
 war_consequences.8.b:0 "Mobilisation limitée et ciblée"
 war_consequences.9.t:0 "L'État au bord de la guerre civile"
 war_consequences.9.d:0 "La crise politique et la faiblesse de la stabilité ouvrent la voie à une insurrection organisée. Selon le régime, une faction opposée tente de prendre le pouvoir. Le conflit civil est géré par le moteur de Hearts of Iron IV."
 war_consequences.9.a:0 "L'insurrection communiste prend les armes"
 war_consequences.9.b:0 "Les forces démocratiques se soulèvent"
 war_consequences.9.c:0 "Une opposition démocratique lance l'insurrection"
 war_consequences.9.d:0 "Une révolution communiste éclate"
 war_consequences.9.e:0 "L'État échappe à ce schéma idéologique"
 war_consequences.10.t:0 "Coup d'État au sein de l'État"
 war_consequences.10.d:0 "Des officiers et des responsables politiques profitent de l'effondrement de l'autorité pour renverser le gouvernement. Le régime change sans élection."
 war_consequences.10.a:0 "Instaurer un pouvoir fasciste"
 war_consequences.10.b:0 "Restaurer un régime démocratique"
 war_consequences.10.c:0 "Réprimer les putschistes"

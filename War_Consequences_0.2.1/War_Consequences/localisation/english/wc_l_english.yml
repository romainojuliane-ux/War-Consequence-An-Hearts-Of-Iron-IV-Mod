l_english:
 war_consequences.1.t:0 "Crisis in the Armed Forces"
 war_consequences.1.d:0 "The war is exhausting units and weakening the chain of command."
 war_consequences.1.a:0 "Restore command authority"
 war_consequences.1.b:0 "Make concessions to the officers"
 war_consequences.2.t:0 "Industrial Disruption"
 war_consequences.2.d:0 "Shortages, destruction and transport difficulties are disrupting production."
 war_consequences.2.a:0 "Prioritise repairs and supply"
 war_consequences.2.b:0 "Keep production running at any cost"
 war_consequences.3.t:0 "Anti-war Demonstrations"
 war_consequences.3.d:0 "The population is growing weary of the conflict."
 war_consequences.3.a:0 "Negotiate with representatives"
 war_consequences.3.b:0 "Maintain the war effort"
 war_consequences.4.t:0 "Separatist Movements Gain Strength"
 war_consequences.4.d:0 "Regional leaders challenge central authority. No new country is created by this event."
 war_consequences.4.a:0 "Offer guarantees to the regions"
 war_consequences.4.b:0 "Reassert national unity"
 war_consequences.5.t:0 "Pressure for a Separate Peace"
 war_consequences.5.d:0 "Some officials demand negotiations even if allies continue fighting. This event does not sign peace automatically."
 war_consequences.5.a:0 "Prepare a diplomatic initiative"
 war_consequences.5.b:0 "Reject any concessions"
 war_consequences.6.t:0 "Government in Exile Organises"
 war_consequences.6.d:0 "The vanilla exile system remains responsible for the actual exile status."
 war_consequences.6.a:0 "Maintain institutions in exile"
 war_consequences.6.b:0 "Focus resources on resistance"
 war_consequences.7.t:0 "Administrative Breakdown"
 war_consequences.7.d:0 "Local administrations can no longer properly implement government decisions."
 war_consequences.7.a:0 "Centralise the remaining resources"
 war_consequences.7.b:0 "Give local authorities more autonomy"
 war_consequences.8.t:0 "General Mobilisation"
 war_consequences.8.d:0 "The government is considering exceptional mobilisation."
 war_consequences.8.a:0 "Mobilise every available resource"
 war_consequences.8.b:0 "Use a limited, targeted mobilisation"
 war_consequences.9.t:0 "The State on the Brink of Civil War"
 war_consequences.9.d:0 "Political crisis and low stability enable an organised uprising. The game's native civil-war engine handles the conflict."
 war_consequences.9.a:0 "A communist insurrection takes up arms"
 war_consequences.9.b:0 "Democratic forces rise up"
 war_consequences.9.c:0 "A democratic opposition launches an insurrection"
 war_consequences.9.d:0 "A communist revolution breaks out"
 war_consequences.9.e:0 "The state does not fit this ideological pattern"
 war_consequences.10.t:0 "Coup d'état within the state"
 war_consequences.10.d:0 "Officers and politicians exploit the collapse of authority to overthrow the government. The regime changes without an election."
 war_consequences.10.a:0 "Establish a fascist regime"
 war_consequences.10.b:0 "Restore a democratic regime"
 war_consequences.10.c:0 "Crush the putschists"
